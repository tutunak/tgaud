name: ci

on:
  push:
  pull_request:

# No `uses:` actions: the runner copies an action into the job container under /var/run, and
# Podman's copy API refuses that path when /var/run is an absolute symlink, as in Debian images
# ("statat var/run/act/actions/...: path escapes from parent"). Plain git avoids it and node.
env:
  TOKEN: ${{ github.token }}

jobs:
  test:
    runs-on: docker
    container: python:3.13
    env:
      # The .python-version file asks for 3.15; the job runs the container's 3.13.
      UV_PYTHON: "3.13"
      UV_PYTHON_DOWNLOADS: never
      # This runner's job network is the host's: a service container is not reachable by name, and a
      # PostgreSQL on the host would be shared with other jobs. The database tests run in local `mise run ci`.
      TGAUD_TEST_NO_DATABASE: "1"
    steps:
      - name: checkout
        run: |
          git init -q .
          git -c http.extraHeader="Authorization: Basic $(printf 'x:%s' "$TOKEN" | base64 -w0)" \
            fetch -q --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
      - name: uv
        run: pip install -q --root-user-action=ignore uv==0.11.16
      - name: tests
        # -rs prints each skip with its reason.
        run: uv sync --locked && uv run pytest -rs

  image:
    needs: test
    runs-on: docker
    # The job container is unprivileged (rootless Podman on the host), so buildah can't mount
    # overlay or create namespaces for RUN steps: vfs storage and chroot isolation avoid both.
    container: quay.io/buildah/stable
    env:
      STORAGE_DRIVER: vfs
      BUILDAH_ISOLATION: chroot
      IMAGE: git.firr.co/company/tgaud
    steps:
      - name: checkout
        run: |
          git init -q .
          git -c http.extraHeader="Authorization: Basic $(printf 'x:%s' "$TOKEN" | base64 -w0)" \
            fetch -q --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
      - run: buildah build -f Containerfile -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" .
      - name: gate
        # The image being published, run the way the deploy role runs it, through the runner's container socket
        # (the same socket the ansible/postgresql checks use). buildah has no read-only root, so the image goes to
        # the host as a docker archive, under a name unique to this run.
        env:
          GATE: tgaud-gate:${{ github.run_id }}
        run: |
          trap 'docker rmi -f "$GATE" >/dev/null 2>&1 || true' EXIT
          buildah push -q "$IMAGE:$GITHUB_SHA" docker-archive:gate.tar:"$GATE"
          dnf install -q -y --setopt=install_weak_deps=False docker-cli
          docker load -q -i gate.tar
          out=$(docker run --rm --network=none --read-only --tmpfs /tmp --cap-drop=all --security-opt=no-new-privileges "$GATE" --selfcheck) \
            || { echo "$out"; exit 1; }
          echo "$out"
          case $out in
            "selfcheck ok: "*) ;;
            *) echo "selfcheck did not print 'selfcheck ok:'" >&2; exit 1 ;;
          esac
          [ "$(printf '%s\n' "$out" | wc -l)" -eq 1 ] || { echo "selfcheck printed more than one line" >&2; exit 1; }
      - name: push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # The automatic token was refused for package writes; this one has write:package.
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" \
            | buildah login -u "${{ vars.REGISTRY_USER }}" --password-stdin git.firr.co
          buildah push "$IMAGE:$GITHUB_SHA"
          buildah push "$IMAGE:latest"
