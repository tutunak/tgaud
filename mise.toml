[tools]
python = "3.15"
uv = "0.11.16"
actionlint = "1.7.12"

[tasks.ci]
description = "Everything CI runs: actionlint, the release scripts' tests, the container checks and the whole test suite (tgstats and tgaud). Set TGAUD_TEST_ADMIN_URL to use a running PostgreSQL 18.6; without it the tests start one with podman."
depends = ["lint-ci", "release-scripts", "image-test", "container-e2e"]
run = "uv run pytest"

[tasks.lint-ci]
description = "actionlint on the workflows (.github/actionlint.yaml)"
run = "actionlint"

[tasks.release-scripts]
description = "CI release-scripts: the release scripts against a throwaway registry and git repo (Docker)"
run = "bash scripts/release/test-release.sh"

[tasks.container-e2e]
description = "Run the image the way the deploy role does: --selfcheck offline, migrate and serve against a test database and the fake Bot API, /health through the published port, SIGTERM."
run = "bash scripts/container-e2e.sh"

[tasks.image-test]
description = "Build the image and run it as the deploy role will: --selfcheck offline, migrate fails cleanly without a database."
run = "bash scripts/image-test.sh"
